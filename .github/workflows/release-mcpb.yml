name: Release .mcpb

# Builds the AgentGuard .mcpb bundle and attaches it to a GitHub Release.
# Publishing the .mcpb as a Release asset lets the Anthropic MCP Directory
# pick up new versions automatically.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build .mcpb bundle
        run: npm run build:mcpb

      - name: Attach .mcpb to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-mcpb/*.mcpb
          fail_on_unmatched_files: true
