name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Use Python for Hermes tests
        if: matrix.node-version == 22
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hermes test dependencies
        if: matrix.node-version == 22
        run: python -m pip install pytest==8.4.2

      - name: Test Hermes plugin
        if: matrix.node-version == 22
        run: python -m pytest plugins/hermes/tests -q
