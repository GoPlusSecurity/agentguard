# GoPlus AgentGuard — native Hermes Agent plugin manifest.
#
# Installed to ~/.hermes/plugins/agentguard/ by `agentguard init --agent hermes`,
# then enabled with `hermes plugins enable agentguard`.
name: agentguard
version: "1.1.28"
description: >-
  GoPlus AgentGuard security guardrails for Hermes. Observes supported main-loop
  model requests and responses, and blocks risky shell, file, and network actions
  at pre_tool_call using the AgentGuard decision engine.
author: GoPlusSecurity
homepage: https://github.com/GoPlusSecurity/agentguard
license: MIT
provides_hooks:
  - pre_llm_call
  - pre_api_request
  - post_api_request
  - pre_tool_call
  - post_tool_call
  - on_session_start
provides_commands:
  - agentguard
